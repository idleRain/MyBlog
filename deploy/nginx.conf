# MyBlog 网关配置：托管 admin 静态资源，反代前台 SSR、后端 API 与媒体文件。
# 容器服务名 server/web 由 docker-compose 网络解析，端口与各容器 EXPOSE 一致。

# 静态与 JSON 文本资源统一启用 gzip 压缩
gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
  listen 80;
  server_name _;

  # 带内容哈希的后台静态资源可长期缓存
  location /admin/_app/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 后台 SPA：静态托管于 /admin 子路径，未命中的前端路由回退到单页入口
  location /admin {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }

  # 后端 API 反代，保留原始 URI 与客户端来源信息
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 媒体文件反代到后端静态服务
  location /uploads/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # 前台 SSR 反代，透传 WebSocket 升级头以支持长连接
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
