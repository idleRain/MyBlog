# 错误码契约 —— 唯一编辑点
#
# 本文件是前后端错误码的单一事实来源，传输层码与哨兵错误映射已固化。
# 锚定方式复用 docs/architecture-rules.md §3.4 的双向锚定，不引入 codegen：
#   - 后端：internal/handler/error_contract_test.go 的 TestErrorMappingMatchesContract，
#     校验本文件 transport 节与 pkg/response 常量一致、mapping 节与 handler 分档注册表双向一致；
#   - 前端：packages/api/src/contracts/errors.test.ts，
#     校验 @myblog/shared 的响应码常量与 pkg/response 逐值一致。
# 任一侧单独改动即变红，门禁入口为 pnpm run contract:check。

# 传输层错误码，与 pkg/response 的预定义码一致（CodeSuccess / CodeInvalid / CodeAuth /
# CodeForbid / CodeNotFound / CodeError）。
# 业务接口响应的 HTTP 状态恒为 200，错误语义由响应体 code 承载；
# 未匹配路由（HTTP 404）与就绪探针未就绪（HTTP 503）不是业务响应，按编排器惯例使用真实状态码。
transport:
  200: 成功
  400: 请求参数错误
  401: 认证失败
  403: 权限不足
  404: 资源不存在
  500: 服务器内部错误

# service 层错误到传输层错误码的映射，唯一映射点为 handler/error.go 的 HandleServiceError，
# 禁止模块私有映射出现第二套权威；handler 层的 binding 校验失败与中间件权限判定不经此处，
# 直接经 pkg/response 返回 400 / 401 / 403。
mapping:
  '403':
    - service.ErrPermissionDenied
  '404':
    # 全部定义于 internal/domain/errors.go；新增 not-found 哨兵须同步扩展此处与映射注册表
    - domain.ErrArticleNotFound
    - domain.ErrCategoryNotFound
    - domain.ErrTagNotFound
    - domain.ErrCommentNotFound
    - domain.ErrMediaNotFound
    - domain.ErrNotificationNotFound
    - domain.ErrFriendlyLinkNotFound
    - domain.ErrSettingNotFound
    - domain.ErrUserNotFound
    - domain.ErrFollowNotFound
    - domain.ErrDictTypeNotFound
    - domain.ErrDictItemNotFound
  '400':
    - service.ErrInvalidRequest
    - service.ErrUsernameTaken
    - service.ErrEmailTaken
  '500':
    # 未命中以上哨兵的错误统一归入此类，响应文案固定为「服务器内部错误」，
    # 原始错误仅写入日志，防止表名、列名与 SQL 片段经响应体泄漏。
    []

# 实现偏差：以下路径与上表冲突，契约口径以上表为准，修复方向是让这些路径改走唯一映射点，
# 不要按现状修改契约；偏差清除后删除本节。
#   - 登录与刷新失败的 401 由 handler 私有分支产生：handler/user.go 的 Login 与 RefreshToken
#     直接调用 response.Unauthorized(c, err.Error()) 返回，绕过 HandleServiceError，
#     构成第二套映射权威。修复方向是为认证失败定义哨兵并在本表增补 '401' 分类；
#     对应的 service 侧裸错误清单见 docs/debt/architecture.md 第 7 条。

# 业务错误码命名空间（目标态，本轮不启用）
# 决策：响应体不新增 bizCode 字段，code 语义维持传输层码；命名空间与业务码
# 待出现真实消费方后再启用，启用时须同时补齐双端常量与锚定测试。
# 命名空间规则：1xxx 用户域、2xxx 文章域、3xxx 评论域、4xxx 分类/标签域、
#              5xxx 媒体域、6xxx 设置/友链域、7xxx 通知域、8xxx 关注域
# 未分配：字典域（dict），排序/分页等通用业务码同样待分配。
namespaces:
  user: 1xxx
  article: 2xxx
  comment: 3xxx
  category: 4xxx
  tag: 4xxx
  media: 5xxx
  setting: 6xxx
  friendly_link: 6xxx
  notification: 7xxx
  follow: 8xxx

# 下列编号为各命名空间内的候选业务码，尚未分配也未产出常量，仅作为启用时的编号参考。
# 1001: 用户名已存在
# 1002: 邮箱已存在
# 1003: 密码错误
# 2001: 文章不存在
# 3001: 评论不存在
