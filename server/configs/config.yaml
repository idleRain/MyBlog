# MyBlog 应用配置文件

# 服务器配置
server:
  host: "localhost"
  port: 3000
  mode: "debug"  # debug, release, test

# 数据库配置
database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "123456"
  dbname: "blog"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100

# 日志配置
logger:
  level: "debug"  # debug, info, warn, error
  output: "stdout"  # stdout, file
  file_path: "logs/app.log"

# API配置
api:
  version: "v1"
  timeout: 30  # 秒

# JWT配置
jwt:
  access_secret: "myblog_access_secret_key_2025"
  refresh_secret: "myblog_refresh_secret_key_2025"
  access_expire: 15  # 分钟
  refresh_expire: 168  # 小时（7天）
  issuer: "myblog"

# API安全配置
security:
  # 频率限制配置
  rate_limit:
    enabled: true
    max_requests: 100          # IP级别最大请求数/分钟
    window_minutes: 1          # 时间窗口（分钟）
    user_max_requests: 300     # 用户级别最大请求数/分钟
    user_window_minutes: 1     # 用户时间窗口（分钟）
    
  # 安全HTTP头配置
  security_headers:
    enabled: true
    content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:"
    x_frame_options: "SAMEORIGIN"
    x_content_type_options: "nosniff"
    referrer_policy: "strict-origin-when-cross-origin"
    strict_transport_security: "max-age=31536000; includeSubDomains"
    
  # 输入验证配置
  input_validation:
    enabled: true
    max_request_size_mb: 10    # 最大请求体大小（MB）
    blocked_user_agents:       # 阻止的User-Agent
      - "curl"
      - "wget"
      - "python-requests"
      - "bot"
      - "crawler"
      - "spider"
      
  # 管理员接口安全配置
  admin_security:
    enabled: true
    max_requests: 30           # 管理员接口IP级别限制
    user_max_requests: 50      # 管理员接口用户级别限制
    ip_whitelist: []           # IP白名单（空表示不启用）

# 媒体文件存储配置
media:
  upload_dir: "uploads"        # 本地存储目录，相对服务运行目录
  base_url: "/uploads"         # 文件访问URL前缀
  max_size_mb: 10              # 单文件大小上限（MB）
  allowed_types: []            # 允许的MIME类型（空表示不限制）

# RBAC权限配置：生产环境角色权限的唯一权威，修改后重启生效，无需重新编译
rbac:
  role_hierarchy:
    superadmin: 4
    admin: 3
    editor: 2
    user: 1
  role_permissions:
    superadmin:
      - "system:config"
      - "system:logs"
      - "system:stats"
      - "user:create"
      - "user:read"
      - "user:update"
      - "user:delete"
      - "user:list"
      - "article:create"
      - "article:read"
      - "article:update"
      - "article:delete"
      - "article:list"
      - "article:publish"
      - "article:manage"
      - "category:manage"
      - "tag:manage"
      - "comment:create"
      - "comment:read"
      - "comment:update"
      - "comment:delete"
      - "comment:moderate"
      - "file:upload"
      - "file:read"
      - "file:delete"
    admin:
      - "system:logs"
      - "system:stats"
      - "user:create"
      - "user:read"
      - "user:update"
      - "user:delete"
      - "user:list"
      - "article:create"
      - "article:read"
      - "article:update"
      - "article:delete"
      - "article:list"
      - "article:publish"
      - "article:manage"
      - "category:manage"
      - "tag:manage"
      - "comment:create"
      - "comment:read"
      - "comment:update"
      - "comment:delete"
      - "comment:moderate"
      - "file:upload"
      - "file:read"
      - "file:delete"
    editor:
      - "user:read"
      - "article:create"
      - "article:read"
      - "article:update"
      - "article:delete"
      - "article:list"
      - "article:publish"
      - "comment:create"
      - "comment:read"
      - "comment:update"
      - "comment:delete"
      - "file:upload"
      - "file:read"
    user:
      - "article:read"
      - "comment:create"
      - "comment:read"
      - "comment:update"