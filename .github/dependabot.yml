# 依赖更新自动化配置，与 CI 的漏洞扫描互补：扫描负责发现漏洞，本配置负责提交升级 PR。
# 次要与补丁更新按生态分组为单个 PR，大版本更新单独成 PR 以便逐个评估。

version: 2
updates:
  # 前端与工具链依赖，pnpm 工作区统一由根目录的 lockfile 描述。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # 后端 Go 依赖，模块根位于 server 目录。
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # 工作流内使用的 action 版本。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope

  # 部署镜像的基础镜像版本。
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
