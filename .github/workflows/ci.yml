# CI：质量防线 + lint + 依赖漏洞扫描。
# 触发方式为 push 到 master/main 以及所有 pull request，均为自动执行。
# 本工作流只做质量检查，不含任何自动部署步骤。

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 质量防线（go 三连 / 依赖基线 / svelte-check / 契约锁 / 前端构建 / 格式 / lint）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js 并启用 pnpm
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod

      - name: 安装依赖（冻结 lock）
        run: pnpm install --frozen-lockfile

      - name: 后端编译、静态检查与测试
        working-directory: server
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      # Go 侧漏洞扫描无严重级划分，存在可达调用链即失败。
      - name: Go 依赖漏洞扫描
        run: pnpm run go:vulncheck

      # 审计端点仅官方 registry 提供；阈值策略为 high/critical 阻塞。
      - name: 前端依赖漏洞扫描
        run: pnpm run audit:deps

      - name: 依赖方向基线（12 service + 1 middleware + 0 router）
        working-directory: server
        run: |
          HITS=$(git grep -ln "MyBlog/internal/repository" -- internal/service internal/middleware internal/router \
            | grep -v '_test\.go$' || true)
          COUNT=$(printf '%s' "$HITS" | grep -c . || true)
          echo "依赖基线命中文件数: ${COUNT}"
          echo "依赖基线命中文件清单:"
          printf '%s\n' "$HITS"
          test "$COUNT" -le 13

      - name: 公共包单测与类型检查
        run: pnpm run test:packages

      # 前台 paraglide 产物同样影响应用的单测解析，需先于应用单测生成。
      - name: 生成前台 i18n 产物
        run: pnpm --filter @myblog/web run generate:i18n

      - name: 应用单元测试
        run: pnpm run test:apps

      - name: 双应用 svelte-check
        run: pnpm run check

      - name: 契约三把锁
        run: pnpm run contract:check

      - name: 前端生产构建（前台与后台）
        run: pnpm run build:apps

      - name: 产物体积度量
        run: pnpm run measure:assets

      - name: 字体产物体积门禁
        run: pnpm run check:fonts

      - name: 格式检查（只读）
        run: pnpm run format:check

      - name: 前端与后端 lint
        run: pnpm run lint
