# 最小 CI：质量防线四件套 + lint（体检项 QA-11 / OPS-06）。
# 触发方式为 push 到 master/main 以及所有 pull request，均为自动执行。
# 本工作流只做质量检查，不含任何自动部署步骤。

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 质量防线（go 三连 / 依赖基线 / svelte-check / 契约锁 / 前端构建 / 格式 / lint）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 并启用 pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: 安装依赖（冻结 lock）
        run: pnpm install --frozen-lockfile

      - name: 后端编译、静态检查与测试
        working-directory: server
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: 依赖方向基线（D1：12 service + 1 middleware + 0 router）
        working-directory: server
        run: |
          HITS=$(git grep -ln "MyBlog/internal/repository" -- internal/service internal/middleware internal/router \
            | grep -v '_test\.go$' || true)
          COUNT=$(printf '%s' "$HITS" | grep -c . || true)
          echo "依赖基线命中文件数: ${COUNT}"
          echo "依赖基线命中文件清单:"
          printf '%s\n' "$HITS"
          test "$COUNT" -le 13

      - name: 公共包单测与类型检查
        run: pnpm run test:packages

      # 前台 i18n 产物由 paraglide 编译生成且不入库，全新检出时目录为空。
      # svelte-check 不会触发 vite 插件编译，故必须先显式生成，否则 $lib/paraglide 与 $i18n 全部解析失败。
      - name: 生成前台 i18n 产物
        run: pnpm --filter @myblog/web run generate:i18n

      - name: 双应用 svelte-check
        run: pnpm run check

      - name: 契约三把锁
        run: pnpm run contract:check

      - name: 前端生产构建（前台与后台）
        run: pnpm run build:apps

      - name: 字体产物体积门禁
        run: node --import tsx scripts/check-font-bundle.ts

      - name: 格式检查（只读）
        run: pnpm run format:check

      - name: 前端与后端 lint
        run: pnpm run lint
