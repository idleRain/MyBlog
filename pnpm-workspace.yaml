# pnpm 工作区配置。
# web 应用已在 Phase 4 拆分为 apps/web 与 apps/admin，由 apps/* 通配符覆盖。
packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  unrs-resolver: true

# 公共依赖版本单一事实来源，跨包共用的依赖统一经 catalog: 协议引用。
catalog:
  # 构建工具链，统一提升至根 devDependencies，仅被 CLI 命令与构建配置文件引用。
  '@sveltejs/adapter-auto': 6.1.1
  '@sveltejs/kit': 2.70.3
  '@sveltejs/vite-plugin-svelte': 7.3.0
  autoprefixer: 10.5.4
  postcss: 8.5.26
  svelte-check: 4.7.6
  tailwindcss: 4.3.3
  '@tailwindcss/forms': 0.5.11
  '@tailwindcss/typography': 0.5.20
  '@tailwindcss/vite': 4.3.3
  typescript: 5.8.3
  unplugin-auto-import: 21.1.0
  vite: 8.2.2
  vite-plugin-devtools-json: 1.1.0
  # 组件库运行时依赖，由 packages/ui 提供，应用层经 $ui 别名使用。
  '@internationalized/date': 3.12.3
  '@lucide/svelte': 1.34.0
  bits-ui: 2.19.0
  embla-carousel-svelte: 8.6.0
  formsnap: 2.0.1
  layerchart: 2.3.0
  mode-watcher: 1.1.0
  paneforge: 1.0.2
  svelte: 5.56.10
  svelte-sonner: 1.2.1
  sveltekit-superforms: 2.30.2
  tailwind-variants: 3.3.1
  tw-animate-css: 1.4.0
  vaul-svelte: 1.0.0-next.7
  # 业务运行时依赖，由 shared/http/api 与应用层按实际 import 情况声明。
  clsx: 2.1.1
  ky: 1.14.3
  mitt: 3.0.1
  tailwind-merge: 3.6.0
  zod: 4.4.3
